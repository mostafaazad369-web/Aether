name: Native HEV lifecycle validation

on:
  push:
    branches: [ feature/aether-pro-branding ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: hev-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hev-native:
    name: Patch, compile HEV and JNI bridge
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.3.11579264"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35"

      - name: Install Android NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" </dev/null
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not set}}"
          test -x "${SDK}/ndk/${NDK_VERSION}/ndk-build"
          echo "ANDROID_NDK_HOME=${SDK}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch pinned native sources and apply lifecycle patch
        run: bash scripts/fetch-natives.sh

      - name: Build HEV and Aether JNI bridge for all Android ABIs
        run: bash scripts/build-natives.sh hev

      - name: Compile Android Kotlin sources
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
